# nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
# Один файл — главный конфиг NGINX. На MVP нет split на nginx.conf + active.conf:
# нет blue/green-переключения, нечего переписывать в runtime.
#
# Что делает:
#   1. Отдаёт статику фронта из /usr/share/nginx/html (туда положил Dockerfile).
#   2. Проксирует /api/* на upstream `api:3001` (Docker DNS внутри сети internal).
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
# auto = по числу CPU. Каждый worker — отдельный процесс. Базовое масштабирование nginx.

error_log /var/log/nginx/error.log warn;
# Уровни (от тихого к громкому): debug | info | notice | warn | error | crit.
# warn — логируем предупреждения и серьёзнее; debug/info слишком шумны в prod.

events {
    worker_connections 1024;
    # Максимум одновременных соединений на worker.
    # Итог по серверу = worker_processes × worker_connections.
}

http {
    # mime.types — стандартный файл сопоставлений расширений → Content-Type.
    # Без него .css / .js отдаются как application/octet-stream → браузер не применит.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    # sendfile — копия файла из FD в socket напрямую (kernel space), без read+write через userspace.
    # Снижает CPU при отдаче статики. Стандартная оптимизация для static-serve.

    tcp_nopush on;
    # Накапливает данные и шлёт TCP-пакетами максимального размера (вместо мелких).
    # Работает только при sendfile on. Уменьшает overhead сети.

    keepalive_timeout 65;
    # Сколько секунд держать idle keep-alive соединение клиента.
    # Стандарт 60-75s; короче — больше TCP-handshake'ов, длиннее — больше открытых FD.

    # gzip — сжимаем текстовые ответы. Браузер шлёт Accept-Encoding: gzip; nginx отдаёт gzip-сжатый body.
    # Для JS/CSS/HTML экономия ~70% трафика. Бинарные форматы (jpg, png) уже сжаты — не трогаем.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── upstream: пул бэкендов для api ─────────────────────────────────────
    # На MVP в пуле один сервер. upstream нужен потому что в proxy_pass ниже мы ссылаемся
    # на ИМЯ пула, а не на IP — это позволит позже добавить несколько реплик
    # без правки location-блока.
    upstream api_backend {
        # `api` — DNS-имя контейнера в сети internal (resolve через Docker DNS).
        # 3001 — порт, на котором listening Express (см. api/src/.../index.ts).
        server api:3001;
    }

    # ── server: единственный публичный server-блок ────────────────────────
    server {
        listen 80;
        # server_name `_` ловит любой Host-header. Для одного домена этого достаточно;
        # при multi-domain хостинге сюда подставляют конкретные имена.
        server_name _;

        # ── /api/* → проксируем на api-backend ────────────────────────────
        # Важно: location /api/ ОБЯЗАН идти ПЕРЕД location / (более специфичный матч).
        # NGINX matching: точные префиксы > regex > generic `/`. Здесь /api/ — префикс,
        # location / — fallback на статику.
        location /api/ {
            # proxy_pass со слэшем в конце (`http://api_backend/`) ОБРЕЗАЕТ префикс /api/
            # перед форвардом. Запрос `/api/health` → backend получает `/health`.
            # Без слэша — `proxy_pass http://api_backend;` — запрос пошёл бы как `/api/health`,
            # и Express пришлось бы знать про этот префикс. Так чище: backend не знает о NGINX-routing.
            proxy_pass http://api_backend/;

            # Стандартные proxy-заголовки. Без них backend видит IP nginx-контейнера
            # вместо реального клиента + не знает оригинальный Host.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты на upstream — без них висящий backend заморозит nginx worker'а.
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── / → статика фронта ────────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            # try_files — SPA fallback. Vite собирает single-page app: все маршруты
            # резолвятся client-side через react-router/wouter/etc. Прямой переход
            # на /foo/bar должен отдать index.html, а не 404 — иначе reload страницы
            # на любом не-корневом URL ломается.
            # Семантика: nginx пробует $uri (файл по точному пути) → $uri/ (директория) → /index.html.
            try_files $uri $uri/ /index.html;
        }
    }
}
